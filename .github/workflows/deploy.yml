name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-lightsail-main
  # Only the latest push matters — cancel older queued/in-progress deploys to save install+build time
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend & backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
          VITE_CRM_URL: https://crm.pydah.edu.in
        run: |
          # npm ci is faster/reproducible when lockfile is present; falls back only if needed
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-offline --no-audit --no-fund
          fi
          printf 'VITE_API_URL=%s\nVITE_CRM_URL=%s\n' "${VITE_API_URL}" "${VITE_CRM_URL}" > .env.production
          npm run build
          test -d dist

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Upload frontend dist to server
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.USERNAME }}
        run: |
          tar -C frontend/dist -czf /tmp/frontend-dist.tgz .
          scp -o StrictHostKeyChecking=yes \
              /tmp/frontend-dist.tgz \
              "${SSH_USER}@${SSH_HOST}:/tmp/frontend-dist.tgz"

      - name: Deploy on Lightsail via SSH
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -o ConnectTimeout=30 \
              "${SSH_USER}@${SSH_HOST}" \
              "export FRONTEND_DIST_TGZ='/tmp/frontend-dist.tgz'; bash -s" \
              < .github/scripts/deploy-remote.sh
