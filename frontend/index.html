  <!-- Instant Synchronous Theme Cache Injection (Zero FOUC, Offline Resilient) -->
  <script>
    (function () {
      try {
        var cached = localStorage.getItem('app_theme_css');
        if (cached) {
          var s = document.createElement('style');
          s.id = 'app-theme-cached';
          s.textContent = cached.replace(/:root\b/g, ':root, :root:root');
          (document.head || document.documentElement).appendChild(s);
        }
      } catch (e) {}
    })();
  </script>

  <!-- Centralized Theme Runtime Loader (Production with resilient fallback) -->
  <script 
    src="https://ui-theme.pydah.edu.in/themes/theme-loader.js" 
    data-theme-server="https://ui-theme.pydah.edu.in"
    data-poll-interval="30"
    onerror="this.onerror=null;var s=document.createElement('script');s.src='/themes/theme-loader.js';s.setAttribute('data-theme-server','https://ui-theme.pydah.edu.in');s.setAttribute('data-poll-interval','30');document.head.appendChild(s);">
  </script>
